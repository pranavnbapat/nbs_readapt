services:
  web:
    image: ${APP_IMAGE:-ghcr.io/pranavnbapat/espon_readapt:latest}
    container_name: espon_readapt_web_prod
    restart: unless-stopped
    env_file:
      - .env
    command: >
      sh -c "
      python manage.py collectstatic --noinput &&
      gunicorn --bind 0.0.0.0:8000 --workers 4 config.wsgi:application
      "
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_started
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=espon_readapt_proxy
      - traefik.http.routers.espon-readapt-http.rule=Host(`${APP_DOMAIN:-espon-readapt.nexavion.com}`)
      - traefik.http.routers.espon-readapt-http.entrypoints=web
      - traefik.http.routers.espon-readapt-http.middlewares=redirect-to-https@file
      - traefik.http.routers.espon-readapt.rule=Host(`${APP_DOMAIN:-espon-readapt.nexavion.com}`)
      - traefik.http.routers.espon-readapt.entrypoints=websecure
      - traefik.http.routers.espon-readapt.tls.certresolver=letsencrypt
      - traefik.http.routers.espon-readapt.middlewares=espon-security@file,espon-compress@file
      - traefik.http.services.espon-readapt.loadbalancer.server.port=8000

  postgres:
    image: postgres:16
    container_name: espon_readapt_postgres_prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-espon_readapt}
      POSTGRES_USER: ${POSTGRES_USER:-espon_readapt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-espon_readapt} -d ${POSTGRES_DB:-espon_readapt}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  opensearch:
    image: opensearchproject/opensearch:3.5.0
    container_name: espon_readapt_opensearch_prod
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-906hKZLA7N8f}
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - internal

networks:
  proxy:
    name: espon_readapt_proxy
    external: true
  internal:
    name: espon_readapt_internal

volumes:
  postgres_data:
  opensearch_data:
